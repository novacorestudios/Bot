# =============================================================================
# Backtest overlay.
#
# Load with:  CONFIG_FILE=config/config.backtest.yaml
#
# The important difference from config.yaml is `edge.bootstrap_enabled: true`.
#
# WHY: without trade history the edge calculator shrinks every win probability
# toward the prior, which at a reward:risk of 2.0 makes every candidate
# negative-edge. Nothing is taken, so no evidence accumulates, so the estimate
# never moves. The system cannot start.
#
# That is CORRECT for live trading — never risk money on an unproven strategy —
# but fatal in a backtest, whose entire purpose is to measure the win rate.
# Bootstrap mode assumes an unproven strategy wins at its exact break-even rate
# after costs, plus a 5 percentage point margin, and counts every trade taken on
# that assumption.
#
# A backtest that used bootstrap estimates reports what WOULD happen if the
# assumption held. It is not evidence that it does. Read the bootstrap counts in
# the report before believing anything else in it.
# =============================================================================

# Inherit every setting from config.yaml, then override only what differs.
# Without this the omitted sections would fall back to code defaults — and an
# empty regime.strategy_weights means NO strategy runs in ANY regime, producing
# a backtest with zero trades that looks like a strategy failure.
extends: config.yaml

account:
  initial_capital: 75.0
  quote_asset: USDT

edge:
  taker_fee: 0.0004
  maker_fee: 0.0002
  assume_taker_entry: true
  assume_taker_exit: true
  base_slippage_bps: 1.0
  impact_coefficient: 0.5
  spread_cost_fraction: 0.5
  funding_interval_hours: 8
  min_expected_edge: 0.0008
  win_rate_prior: 0.45
  win_rate_prior_weight: 40.0
  # See the note above. Never enable this for LIVE.
  bootstrap_enabled: true
  bootstrap_win_rate_margin: 0.05
  bootstrap_min_trades: 30

backtest:
  taker_fee: 0.0004
  maker_fee: 0.0002
  slippage_bps: 1.5
  spread_bps: 1.0
  apply_funding: true
  fill_model: next_open
  # Never change this to 'optimistic' for a result you intend to trust.
  intrabar: pessimistic
  warmup_bars: 250
