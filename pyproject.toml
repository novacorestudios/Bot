[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "Dynamic Multi-Strategy Binance USDⓈ-M Futures Short-Term Trading Engine"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.optional-dependencies]
dev = [
    "pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=4.1",
    "ruff>=0.3", "mypy>=1.8", "bandit>=1.7", "pip-audit>=2.7", "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
tradebot = "tradebot.app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes `pytest` work from the repository root without PYTHONPATH=src. Without
# this every contributor has to know the incantation, and CI only worked because
# it happened to export the variable.
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests",
    "network: requires outbound access to Binance (skipped by default)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RET", "ARG", "PIE"]
ignore = ["E501", "B008", "SIM108", "RET504", "ARG002"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "B"]

[tool.mypy]
python_version = "3.11"
# Without this plugin mypy does not understand pydantic's field defaults and
# reports ~139 phantom "missing named argument" errors on every model
# instantiation, which drowns out the real findings.
plugins = ["pydantic.mypy"]
# Typing debt is tracked in mypy-baseline.txt and gated in CI: new errors fail
# the build, the existing count may only go down.
packages = ["tradebot"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.coverage.run]
source = ["src/tradebot"]
omit = ["*/dashboard/*"]
