name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]" || pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check src tests scripts
      - name: Ruff format check
        run: ruff format --check src tests scripts
      # A real gate. It was `|| true` while typing debt existed; that debt is
      # now zero, so a new type error fails the build rather than being hidden.
      - name: Mypy
        run: mypy src/tradebot

  test:
    name: Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, failure]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Editable install, so `pytest` resolves the package the same way a
      # contributor's checkout does — no PYTHONPATH incantation.
      - run: pip install -r requirements-dev.txt && pip install -e .
      - name: Run ${{ matrix.suite }} tests
        run: pytest tests/${{ matrix.suite }} -q --cov=src/tradebot --cov-report=xml
      - name: Upload coverage
        if: matrix.suite == 'unit'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.suite }}
          path: coverage.xml
          if-no-files-found: ignore

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Bandit (static security analysis)
        run: bandit -r src -c pyproject.toml -q
      # Also a real gate. A newly disclosed vulnerability in a dependency
      # should stop a deploy, not produce a green build.
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt --strict
      - name: Refuse committed secrets
        run: python scripts/check_secrets.py

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t tradebot:ci .
      # The ENTRYPOINT already prepends `python -m tradebot.app.cli`, so the
      # container command is a bare SUBCOMMAND. Passing an interpreter here
      # lands in the `command` positional and argparse rejects it.
      - name: Config validates in PAPER mode with no credentials
        run: docker run --rm -e TRADING_MODE=PAPER tradebot:ci validate-config
      - name: Doctor runs without credentials and without a network call
        run: docker run --rm -e TRADING_MODE=PAPER tradebot:ci doctor
      - name: The default command is the engine, not a shell
        run: docker inspect --format '{{json .Config.Cmd}}' tradebot:ci | grep -qx '\["run"\]'
      # A mis-set container variable must be caught before the process can
      # open a socket to Binance. Exit 78 is EX_CONFIG, from the entrypoint.
      - name: Image refuses LIVE without the risk acknowledgement
        run: |
          set +e
          output=$(docker run --rm -e TRADING_MODE=LIVE -e BINANCE_TESTNET=false \
            tradebot:ci validate-config 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 78 || { echo "expected exit 78, got $status"; exit 1; }
          echo "$output" | grep -q "REFUSING TO START"
      - name: Image refuses LIVE against the testnet endpoint
        run: |
          set +e
          docker run --rm -e TRADING_MODE=LIVE -e BINANCE_TESTNET=true \
            -e I_UNDERSTAND_LIVE_TRADING_RISK=YES tradebot:ci validate-config
          status=$?
          set -e
          test "$status" -eq 78 || { echo "expected exit 78, got $status"; exit 1; }
      - name: Image runs as a non-root user
        run: |
          user=$(docker inspect --format '{{.Config.User}}' tradebot:ci)
          test "$user" = "tradebot" || { echo "image runs as '$user'"; exit 1; }
